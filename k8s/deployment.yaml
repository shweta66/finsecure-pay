apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsecure-pay

spec:
  replicas: 2

  selector:
    matchLabels:
      app: finsecure-pay

  template:
    metadata:
      labels:
        app: finsecure-pay

    spec:
      containers:
        - name: finsecure-pay
          image: shwts66/finsecure-pay:1.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          envFrom:
            - configMapRef:
                name: finsecure-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10